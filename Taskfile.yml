version: '3'

vars:
  RAW_TAG: '{{ .RAW_TAG | default (env "RAW_TAG" | default "v0.0.0-dev") }}'
  VERSION: '{{ trimPrefix "v" .RAW_TAG }}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:go:
    desc: Run Go tests
    dir: backend/go
    cmds:
      - go test ./...

  lint:go:
    desc: Lint Go backend (golangci-lint)
    dir: backend/go
    cmds:
      - golangci-lint run ./...

  lint:go:fix:
    desc: Auto-fix Go lint issues
    dir: backend/go
    cmds:
      - golangci-lint run --fix ./...

  dev:web:
    desc: Run Go backend + Vite web app together (VITE_API_BASE wired from backend handshake)
    cmds:
      - node scripts/dev-web.mjs

  typecheck:web:
    desc: Typecheck the web app (vue-tsc)
    dir: frontend/web
    cmds:
      - pnpm typecheck

  test:web:
    desc: Run web app unit tests (Vitest)
    dir: frontend/web
    cmds:
      - pnpm test

  build:web:
    desc: Build the web app for production
    dir: frontend/web
    cmds:
      - pnpm build

  e2e:web:
    desc: Run web e2e smoke (Playwright; boots backend + Vite). Requires `pnpm exec playwright install chromium` once.
    dir: frontend/web
    env:
      ONSEI_E2E: '1'
    cmds:
      - pnpm exec playwright test

  e2e:web:install:
    desc: Install the Playwright Chromium browser for the web e2e smoke
    dir: frontend/web
    cmds:
      - pnpm exec playwright install chromium

  ci:quality:
    desc: Run quality checks (Go + Web)
    cmds:
      - task test:go
      - task lint:go
      - task typecheck:web
      - task test:web
      - task build:web

  build:go:windows-x64:
    desc: Build Windows backend binary (x64)
    dir: backend/go
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o bin/onsei-organizer-backend.exe ./cmd/onsei-organizer-backend
