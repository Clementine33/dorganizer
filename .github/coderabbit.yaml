language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_instructions: |
    Begin the summary with the heading "## AI Review Summary", followed by the
    PR title, then a concise overview of the changes in this PR.
  sequence_diagrams: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
tools:
  golangci-lint:
    enabled: true
  eslint:
    enabled: true
  actionlint:
    enabled: true
  yamllint:
    enabled: true
  gitleaks:
    enabled: true
chat:
  auto_reply: true
