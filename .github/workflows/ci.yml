name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # All runtimes (go, node, pnpm, task) come from mise.toml — single source of truth.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.13
          cache: true
          cache_key_prefix: mise-go
      - name: Run Go tests
        run: task test:go

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.13
          cache: true
          cache_key_prefix: mise-web
      # mise-action caches tool installs but not the pnpm store; the old
      # setup-node `cache: pnpm` is gone, so cache the store explicitly.
      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck web app
        run: pnpm typecheck:web
      - name: Run web unit tests
        run: pnpm test:web
      - name: Build web app
        run: pnpm build:web
      # Optional e2e smoke: boots the real Go backend (go from mise.toml)
      # + Vite via the Playwright webServer launcher. Non-blocking for now —
      # local runs use `task e2e:web` / ONSEI_E2E=1.
      - name: Install Playwright Chromium
        run: pnpm -C frontend/web exec playwright install chromium
      - name: Playwright e2e smoke (optional)
        continue-on-error: true
        run: pnpm -C frontend/web exec playwright test
        env:
          ONSEI_E2E: '1'

  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.13
          cache: true
          cache_key_prefix: mise-flutter
      # Legacy Flutter app is scheduled for removal — keep flutter installed by
      # its own action (stable channel); only `task` comes from mise.toml here.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('frontend/flutter_app/pubspec.lock') }}
      - name: Run Flutter tests
        run: task test:flutter
      - name: Run Flutter analyze
        run: task analyze:flutter

  # Windows dev-environment gate: catches regressions in Windows-only paths
  # (dev-web.mjs isWin/.cmd handling, .exe build) that Linux CI cannot see.
  # Main jobs run on Linux for speed/cost; this stays lean.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.13
          cache: true
          cache_key_prefix: mise-windows
      - name: Build Windows backend binary
        run: task build:go:windows-x64
      - name: Install Playwright Chromium
        run: pnpm -C frontend/web exec playwright install chromium
      - name: Playwright e2e smoke (optional, non-blocking)
        continue-on-error: true
        run: pnpm -C frontend/web exec playwright test
        env:
          ONSEI_E2E: '1'