# Based on https://github.com/maratori/golangci-lint-config
# (golden config for golangci-lint v2, MIT, adapted to this repo)
version: "2"

issues:
  max-same-issues: 50

formatters:
  enable:
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/onsei/organizer/backend
    golines:
      max-len: 120

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - funcorder
    - funlen
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - gocritic
    - gocyclo
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - iface
    - ineffassign
    - intrange
    - iotamixing
    - makezero
    - mirror
    - modernize
    - nakedret
    - nilnesserr
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - staticcheck
    - testableexamples
    - tparallel
    - unconvert
    - testpackage
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    cyclop:
      max-complexity: 35
      package-average: 25.0

    depguard:
      rules:
        "deprecated":
          files: [ "$all" ]
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead

    embeddedstructfieldcheck:
      forbid-mutex: true

    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*github.com/onsei/organizer/backend/internal/repo/sqlite.Repository).UpdateScanSessionStatus

    exhaustive:
      check: [ switch, map ]

    funcorder:
      struct-method: false

    funlen:
      lines: 100
      statements: 60

    gocognit:
      min-complexity: 40

    gocyclo:
      min-complexity: 30

    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false

    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: false

    gosec:
      excludes:
        - G104
        - G301
        - G306
        - G404
        - G202
        - G108 # pprof intentionally exposed on dev entry
        - G703 # path traversal in desktop local tool
        - G706 # log taint

    nakedret:
      max-func-lines: 0

    nolintlint:
      allow-no-explanation: [ funlen, gocognit, golines ]
      require-explanation: true
      require-specific: true

    perfsprint:
      strconcat: false
      error-format: false

    reassign:
      patterns: [ ".*" ]

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1022
        - -QF1008

  exclusions:
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - source: 'TODO'
        linters: [ godot ]
      - path: 'internal/services/scanner/service\.go'
        linters: [ errcheck ]
      - path: 'internal/services/execute/convert_pool_test\.go'
        linters: [ gocritic ]
      - path: 'internal/services/execute/convert_pool\.go'
        linters: [ unused ]
      - path: 'internal/services/reconcile/reconcile\.go'
        linters: [ gocritic ]
      - path: 'internal/bootstrap/handshake_test\.go'
        linters: [ paralleltest ]
      - path: 'cmd/onsei-organizer-backend/.*'
        linters: [ gocognit, cyclop, gocyclo, forbidigo, funlen, gosec, gocritic, errcheck, unused, govet, testpackage, paralleltest ]
      - path: 'internal/repo/sqlite/.*'
        linters: [ funlen, gocognit, cyclop, gocyclo, govet, testpackage, paralleltest ]
      - path: 'internal/services/.*'
        linters: [ gocognit, gocyclo, funlen, cyclop, govet, testpackage, paralleltest ]
      - path: 'internal/usecase/.*'
        linters: [ gocognit, gocyclo, funlen, cyclop, govet, testpackage, paralleltest ]
      - path: 'internal/httpapi/.*'
        linters: [ funlen, govet, testpackage, paralleltest ]
      - path: 'internal/grpc/.*'
        linters: [ testpackage, paralleltest ]
      - path: 'internal/pathnorm/.*'
        linters: [ testpackage, paralleltest ]
      - path: 'tests/e2e/.*'
        linters: [ testpackage, paralleltest ]
      - path: 'internal/services/scanner/sqlite_adapter\.go'
        linters: [ staticcheck ]
      - path: 'tests/e2e/scan_plan_execute_test\.go'
        linters: [ staticcheck ]
      - path: 'internal/grpc/plan_rpc\.go'
        linters: [ unused ]
      - path: 'internal/usecase/execute/.*'
        linters: [ gocognit, gocyclo, funlen, cyclop, unused ]
      - path: 'internal/usecase/plan/.*'
        linters: [ gocognit, gocyclo, funlen, cyclop, unused ]
      - path: '_test\.go'
        linters:
          - bodyclose
          - dupl
          - errcheck
          - funlen
          - goconst
          - gosec
          - noctx
          - gocognit
          - cyclop
          - gochecknoglobals
          - unparam
          - funcorder
          - intrange
          - gocyclo
          - modernize
          - unused
          - govet
