version: '3'

vars:
  GO: go

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run all Go tests
    cmds:
      - '{{.GO}} test ./...'

  test:e2e:
    desc: Run e2e tests only
    cmds:
      - '{{.GO}} test ./tests/e2e -v'

  build:
    desc: Build backend binary
    cmds:
      - '{{.GO}} build -o bin/onsei-organizer-backend ./cmd/onsei-organizer-backend'

  build:windows:
    desc: Build Windows backend binary
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - '{{.GO}} build -o bin/onsei-organizer-backend.exe ./cmd/onsei-organizer-backend'

  run:
    desc: Run backend service
    cmds:
      - '{{.GO}} run ./cmd/onsei-organizer-backend'

  clean:
    desc: Remove build output
    cmds:
      - '{{.GO}} clean'

  fmt:
    desc: Format Go code
    cmds:
      - '{{.GO}} fmt ./...'

  vet:
    desc: Run go vet
    cmds:
      - '{{.GO}} vet ./...'

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Auto-fix mechanical golangci-lint issues
    cmds:
      - golangci-lint run --fix ./...
